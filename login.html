<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Cabs - Login</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS v4 CDN Browser Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-slate-100 min-h-screen flex flex-col justify-center items-center font-sans antialiased p-4">

    <!-- Floating Toast Notification Container -->
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- LOGIN CARD -->
    <section class="w-full max-w-md">
        <!-- Premium dark minimal card styling matching Zebralearn mockup -->
        <div class="bg-[#050505] border border-neutral-900 rounded-[2rem] p-8 shadow-2xl transition-all duration-300">

            <!-- Branding Header -->
            <div class="text-center mb-6">
                <div
                    class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 shadow-lg shadow-amber-500/5 mb-4">
                    <svg class="w-9 h-9 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z" />
                        <circle cx="12" cy="9" r="2.5" />
                        <path d="M8 15a4 4 0 0 1 8 0" />
                    </svg>
                </div>

                <h1 class="text-2xl font-extrabold tracking-tight text-white">Welcome to Indian Cabs</h1>
                <p class="text-xs text-neutral-400 font-medium mt-1">Enter your credentials to login</p>
            </div>

            <!-- Login Form (novalidate stops HTML5 popups) -->
            <form id="auth-form" novalidate onsubmit="handleLoginSubmit(event)" class="space-y-4">

                <!-- Full Name (Only for Signup) -->
                <div id="group-fullname" style="display: none;">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-neutral-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" id="auth-fullname" placeholder="Full Name"
                            class="block w-full pl-11 pr-4 py-3.5 bg-black border border-neutral-800 rounded-2xl text-neutral-100 placeholder-neutral-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
                    </div>
                </div>

                <!-- Phone Number (Only for Signup) -->
                <div id="group-number" style="display: none;">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-neutral-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                            </svg>
                        </div>
                        <input type="number" id="auth-number" placeholder="Phone Number"
                            class="block w-full pl-11 pr-4 py-3.5 bg-black border border-neutral-800 rounded-2xl text-neutral-100 placeholder-neutral-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
                    </div>
                </div>

                <!-- Address (Only for Signup) -->
                <div id="group-address" style="display: none;">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-neutral-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                        <input type="text" id="auth-address" placeholder="Address (e.g. Surat, Gujarat)"
                            class="block w-full pl-11 pr-4 py-3.5 bg-black border border-neutral-800 rounded-2xl text-neutral-100 placeholder-neutral-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
                    </div>
                </div>

                <!-- Vehicle Number (Only for Driver Signup) -->
                <div id="group-vehicle" style="display: none;">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-neutral-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3C13 6.8 11.5 6 9 6H5a3 3 0 0 0-3 3v7c0 .6.4 1 1 1h2" />
                                <circle cx="7" cy="17" r="2" />
                                <path d="M9 17h6" />
                                <circle cx="17" cy="17" r="2" />
                            </svg>
                        </div>
                        <input type="text" id="auth-vehicle" placeholder="Vehicle Number (e.g. MH12AB1234)"
                            class="block w-full pl-11 pr-4 py-3.5 bg-black border border-neutral-800 rounded-2xl text-neutral-100 placeholder-neutral-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
                    </div>
                </div>

                <!-- Username/Email -->
                <div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-neutral-500" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                            </svg>
                        </div>
                        <input type="text" id="auth-email" required placeholder="Email or Username"
                            class="block w-full pl-11 pr-4 py-3.5 bg-black border border-neutral-800 rounded-2xl text-neutral-100 placeholder-neutral-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-neutral-500" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                        <input type="password" id="auth-password" required placeholder="Password"
                            class="block w-full pl-11 pr-11 py-3.5 bg-black border border-neutral-800 rounded-2xl text-neutral-100 placeholder-neutral-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all">
                        <button type="button" onclick="togglePasswordVisibility()"
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-neutral-400 hover:text-neutral-200 cursor-pointer">
                            <svg id="eye-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- Submit Button -->
                <button type="submit" id="btn-auth-submit"
                    class="w-full py-3.5 px-4 rounded-2xl font-bold bg-white hover:bg-neutral-200 text-black shadow-lg hover:-translate-y-0.5 transition-all duration-200 cursor-pointer mt-4">
                    Login
                </button>
            </form>

            <!-- Dynamic Toggle Link below Submit Button -->
            <div class="text-center text-xs text-slate-400 mt-6 font-semibold">
                <span id="auth-switch-desc">Don't have an account?</span>
                <button type="button" id="btn-auth-toggle" onclick="handleAuthToggleClick()"
                    class="text-orange-500 hover:text-orange-400 font-bold ml-1 transition-all cursor-pointer">
                    Sign In
                </button>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="text-center py-6 text-neutral-700 text-xs mt-8 space-y-2">
        <p>Indian Cabs System v1.1 • Tailwind Edition</p>
        <p class="text-neutral-500">
            <a href="login.html" class="hover:underline hover:text-sky-400 font-semibold">Customer Login</a> •
            <a href="driver_login.html" class="hover:underline hover:text-amber-400 font-semibold">Driver Portal</a> •
            <a href="admin_login.html" class="hover:underline hover:text-purple-400 font-semibold">Admin Control
                Center</a>
        </p>
    </footer>

    <!-- SCRIPT -->
    <script src="mock-backend.js"></script>
    <script src="login.js"></script>
</body>

</html>
